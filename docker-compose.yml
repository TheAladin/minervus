services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: minervus
      POSTGRES_PASSWORD: minervus
      POSTGRES_DB: minervus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minervus -d minervus"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
